<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 620" font-family="'Segoe UI', system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#f8f9fa"/>
      <stop offset="100%" stop-color="#e9ecef"/>
    </linearGradient>
    <linearGradient id="grad-start" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <linearGradient id="grad-check" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6b7280"/>
      <stop offset="100%" stop-color="#4b5563"/>
    </linearGradient>
    <linearGradient id="grad-pr" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#16a34a"/>
    </linearGradient>
    <linearGradient id="grad-merged" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <linearGradient id="grad-error" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>
    <linearGradient id="grad-fix" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.15"/>
    </filter>
    <filter id="shadow-sm" x="-10%" y="-10%" width="125%" height="125%">
      <feDropShadow dx="0" dy="1" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#6b7280"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#16a34a"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#dc2626"/>
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#d97706"/>
    </marker>
    <marker id="arrow-purple" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="700" height="620" rx="16" fill="url(#bg)"/>

  <!-- Title -->
  <text x="350" y="38" text-anchor="middle" font-size="22" font-weight="700" fill="#1f2937">Uploading Finetunes — How It Works</text>
  <text x="350" y="58" text-anchor="middle" font-size="13" fill="#6b7280">All uploads from community users become Pull Requests</text>

  <!-- Step 1: User clicks upload -->
  <rect x="175" y="78" width="350" height="50" rx="25" fill="url(#grad-start)" filter="url(#shadow)"/>
  <text x="350" y="108" text-anchor="middle" font-size="14" font-weight="700" fill="white">1️⃣  You click "Upload to Registry"</text>

  <!-- Arrow down -->
  <line x1="350" y1="128" x2="350" y2="158" stroke="#6b7280" stroke-width="2" marker-end="url(#arrow-gray)"/>

  <!-- Step 2: Plugin checks token -->
  <rect x="175" y="162" width="350" height="50" rx="25" fill="url(#grad-check)" filter="url(#shadow)"/>
  <text x="350" y="192" text-anchor="middle" font-size="14" font-weight="700" fill="white">2️⃣  Plugin checks if you have a token</text>

  <!-- Branch: split to two paths -->
  <line x1="350" y1="212" x2="350" y2="228" stroke="#6b7280" stroke-width="2"/>
  <line x1="350" y1="228" x2="200" y2="228" stroke="#16a34a" stroke-width="2"/>
  <line x1="350" y1="228" x2="500" y2="228" stroke="#dc2626" stroke-width="2"/>
  <line x1="200" y1="228" x2="200" y2="253" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="500" y1="228" x2="500" y2="253" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Branch labels -->
  <text x="260" y="245" font-size="13" fill="#16a34a" font-weight="600">Has a token →</text>
  <text x="425" y="245" font-size="13" fill="#dc2626" font-weight="600">← No token</text>

  <!-- ============ LEFT PATH: Has token ============ -->

  <!-- Step 3a: PR Created -->
  <rect x="40" y="258" width="320" height="60" rx="10" fill="white" stroke="#22c55e" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="200" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#16a34a">📬  Pull Request Created</text>
  <text x="200" y="304" text-anchor="middle" font-size="12" fill="#6b7280">Your finetune is submitted as a PR</text>

  <!-- Arrow down -->
  <line x1="200" y1="318" x2="200" y2="348" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow-green)"/>

  <!-- Step 4a: Owner reviews -->
  <rect x="40" y="352" width="320" height="50" rx="10" fill="white" stroke="#22c55e" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="200" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">👁️  Space owner reviews the PR</text>
  <text x="200" y="393" text-anchor="middle" font-size="12" fill="#6b7280">They check your submission and merge it</text>

  <!-- Arrow down -->
  <line x1="200" y1="402" x2="200" y2="432" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- Step 5a: Merged -->
  <rect x="40" y="436" width="320" height="50" rx="10" fill="url(#grad-merged)" filter="url(#shadow)"/>
  <text x="200" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="white">✅  PR Merged → In Browse Tab</text>
  <text x="200" y="477" text-anchor="middle" font-size="12" fill="#e9d5ff">Everyone can see and download it now</text>

  <!-- Arrow down to end -->
  <line x1="200" y1="486" x2="200" y2="516" stroke="#7c3aed" stroke-width="2" marker-end="url(#arrow-purple)"/>

  <!-- End node -->
  <rect x="90" y="520" width="220" height="40" rx="20" fill="white" stroke="#8b5cf6" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="200" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#7c3aed">🎉  Done!</text>

  <!-- ============ RIGHT PATH: No token ============ -->

  <!-- Step 3b: Error -->
  <rect x="360" y="258" width="300" height="60" rx="10" fill="white" stroke="#ef4444" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="510" y="284" text-anchor="middle" font-size="14" font-weight="700" fill="#dc2626">❌  Upload Blocked</text>
  <text x="510" y="304" text-anchor="middle" font-size="12" fill="#6b7280">Plugin shows error with setup instructions</text>

  <!-- Arrow down -->
  <line x1="510" y1="318" x2="510" y2="348" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Step 4b: Get a token -->
  <rect x="370" y="352" width="280" height="50" rx="10" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="510" y="376" text-anchor="middle" font-size="14" font-weight="600" fill="#374151">💡  Set up your token</text>
  <text x="510" y="393" text-anchor="middle" font-size="12" fill="#6b7280">Create one on huggingface.co/settings/tokens</text>

  <!-- Arrow down -->
  <line x1="510" y1="402" x2="510" y2="432" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- Step 5b: Try again -->
  <rect x="370" y="436" width="280" height="50" rx="10" fill="url(#grad-fix)" filter="url(#shadow)"/>
  <text x="510" y="460" text-anchor="middle" font-size="14" font-weight="700" fill="white">🔑  Add token to config.json</text>
  <text x="510" y="477" text-anchor="middle" font-size="12" fill="#fef3c7">Then try uploading again</text>

  <!-- Arrow down to end -->
  <line x1="510" y1="486" x2="510" y2="516" stroke="#d97706" stroke-width="2" marker-end="url(#arrow-amber)"/>

  <!-- End node -->
  <rect x="400" y="520" width="220" height="40" rx="20" fill="white" stroke="#f59e0b" stroke-width="2" filter="url(#shadow-sm)"/>
  <text x="510" y="546" text-anchor="middle" font-size="13" font-weight="600" fill="#d97706">🔄  Try again</text>

  <!-- Bottom note -->
  <text x="350" y="595" text-anchor="middle" font-size="11" fill="#9ca3af">You only need a classic read-only User Access Token. No write permissions required.</text>
</svg>
