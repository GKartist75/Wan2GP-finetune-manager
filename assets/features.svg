<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="'Segoe UI', system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="card1" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <linearGradient id="card2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="card3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="card4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="card5" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" rx="16"/>

  <!-- Header -->
  <text x="60" y="52" fill="#e2e8f0" font-size="26" font-weight="700">Wan2GP Finetune Manager</text>
  <text x="60" y="78" fill="#94a3b8" font-size="14">v3.2.0 - Community finetune registry plugin for Wan2GP</text>

  <!-- Decorative line -->
  <line x1="60" y1="92" x2="1140" y2="92" stroke="#334155" stroke-width="1"/>

  <!-- Feature Card 1: Browse & Discover -->
  <rect x="60" y="115" width="520" height="160" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="115" width="6" height="160" rx="3" fill="url(#card1)"/>
  <text x="90" y="150" fill="#e2e8f0" font-size="17" font-weight="600">Search &amp; Browse</text>
  <text x="90" y="175" fill="#94a3b8" font-size="12">Load community finetunes from the Hugging Face registry.</text>
  <text x="90" y="198" fill="#64748b" font-size="11">- Search by name, description, author, or tags</text>
  <text x="90" y="216" fill="#64748b" font-size="11">- Filter by architecture (t2v, i2v, hunyuan, vace_14B)</text>
  <text x="90" y="234" fill="#64748b" font-size="11">- Scrollable card UI with descriptions, URLs, LoRAs &amp; tags</text>
  <text x="90" y="252" fill="#64748b" font-size="11">- URL validation with per-URL green/red status indicators</text>

  <!-- Feature Card 2: Load & Switch -->
  <rect x="620" y="115" width="520" height="160" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="620" y="115" width="6" height="160" rx="3" fill="url(#card2)"/>
  <text x="650" y="150" fill="#e2e8f0" font-size="17" font-weight="600">Download &amp; Switch</text>
  <text x="650" y="175" fill="#94a3b8" font-size="12">Download and activate finetunes without leaving the UI.</text>
  <text x="650" y="198" fill="#64748b" font-size="11">- Download &amp; Switch - one-click load into Wan2GP</text>
  <text x="650" y="216" fill="#64748b" font-size="11">- Download - save locally without switching model</text>
  <text x="650" y="234" fill="#64748b" font-size="11">- Pre-Download checkpoints &amp; LoRAs before loading</text>
  <text x="650" y="252" fill="#64748b" font-size="11">- Improves loading reliability for large model files</text>

  <!-- Feature Card 3: Create & Edit -->
  <rect x="60" y="295" width="520" height="155" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="295" width="6" height="155" rx="3" fill="url(#card3)"/>
  <text x="90" y="330" fill="#e2e8f0" font-size="17" font-weight="600">Finetune Editor</text>
  <text x="90" y="355" fill="#94a3b8" font-size="12">Full editor matching the built-in Alt+F editor.</text>
  <text x="90" y="378" fill="#64748b" font-size="11">- Tabbed: URLs, LoRAs, Resolutions, Help, Settings</text>
  <text x="90" y="396" fill="#64748b" font-size="11">- Markdown toolbar, auto-ID, Source Model field</text>
  <text x="90" y="414" fill="#64748b" font-size="11">- Creator/Editor mode, two-step delete confirmation</text>
  <text x="90" y="432" fill="#64748b" font-size="11">- Variant creation: registry finetune to editor form</text>

  <!-- Feature Card 4: CivitAI -->
  <rect x="620" y="295" width="520" height="155" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="620" y="295" width="6" height="155" rx="3" fill="url(#card4)"/>
  <text x="650" y="330" fill="#e2e8f0" font-size="17" font-weight="600">CivitAI Browser</text>
  <text x="650" y="355" fill="#94a3b8" font-size="12">Search and import models from CivitAI directly.</text>
  <text x="650" y="378" fill="#64748b" font-size="11">- Search by query, filter by type and base model</text>
  <text x="650" y="396" fill="#64748b" font-size="11">- Browse results with model info and version list</text>
  <text x="650" y="414" fill="#64748b" font-size="11">- One-click version URL fill into editor form</text>
  <text x="650" y="432" fill="#64748b" font-size="11">- No API key required for basic search</text>

  <!-- Feature Card 5: Upload & Share -->
  <rect x="60" y="470" width="520" height="135" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  <rect x="60" y="470" width="6" height="135" rx="3" fill="url(#card5)"/>
  <text x="90" y="505" fill="#e2e8f0" font-size="17" font-weight="600">Upload &amp; Share</text>
  <text x="90" y="530" fill="#94a3b8" font-size="12">Contribute your finetunes to the community registry.</text>
  <text x="90" y="553" fill="#64748b" font-size="11">- Upload finetune JSONs to Hugging Face registry</text>
  <text x="90" y="571" fill="#64748b" font-size="11">- Automatic index integration for community discovery</text>
  <text x="90" y="589" fill="#64748b" font-size="11">- Tags and full metadata included in entries</text>

  <!-- Stats section -->
  <rect x="620" y="470" width="520" height="135" rx="12" fill="#1e293b" filter="url(#shadow)"/>
  <text x="650" y="505" fill="#e2e8f0" font-size="17" font-weight="600">Plugin Stats</text>

  <rect x="650" y="525" width="110" height="60" rx="8" fill="#1e1b4b"/>
  <text x="705" y="550" fill="#a5b4fc" font-size="22" font-weight="700" text-anchor="middle">147</text>
  <text x="705" y="570" fill="#64748b" font-size="11" text-anchor="middle">Unit Tests</text>

  <rect x="780" y="525" width="110" height="60" rx="8" fill="#0c1929"/>
  <text x="835" y="550" fill="#93c5fd" font-size="22" font-weight="700" text-anchor="middle">1.7k</text>
  <text x="835" y="570" fill="#64748b" font-size="11" text-anchor="middle">Lines of Code</text>

  <rect x="910" y="525" width="110" height="60" rx="8" fill="#064e3b"/>
  <text x="965" y="550" fill="#6ee7b7" font-size="22" font-weight="700" text-anchor="middle">5</text>
  <text x="965" y="570" fill="#64748b" font-size="11" text-anchor="middle">Plugin Tabs</text>

  <!-- Footer -->
  <text x="60" y="620" fill="#475569" font-size="11">Made for the Wan2GP community by GKartist75 - github.com/GKartist75/Wan2GP-finetune-manager</text>
</svg>
